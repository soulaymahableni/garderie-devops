# Démarre Jenkins en local : docker compose up -d --build   (depuis le dossier jenkins/)
# Interface : http://localhost:8080
services:
  jenkins:
    build: .
    container_name: jenkins
    user: root            # nécessaire pour utiliser /var/run/docker.sock
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
