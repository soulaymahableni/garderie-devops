# Inventaire utilisé par Vagrant (provisioner ansible_local : Ansible tourne dans la VM)
[garderie]
garderie-vm ansible_connection=local

# Pour un Ansible lancé depuis la machine hôte, utiliser plutôt :
# garderie-vm ansible_host=192.168.56.10 ansible_user=vagrant ansible_ssh_private_key_file=../.vagrant/machines/default/virtualbox/private_key

[garderie:vars]
deploy_user=vagrant
